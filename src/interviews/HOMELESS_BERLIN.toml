# Interview id is the filename: HOMELESS_BERLIN
# Optional per-agent `model` pins that agent to one model name for every provider.
# Delete those lines to use the provider default (openai gpt-4o, gemini gemini-2.5-flash-lite, claude claude-haiku-5-5).
# The LLM_MODEL variable, if set, overrides every agent.
# The original app used the `model` values below for OpenAI and gemini-2.5-flash-lite for Gemini.

_name = "HOMELESS_BERLIN"
_description = "Interview about perceptions of homelessness in Berlin: causes, persistence, and potential solutions."

moderate_answers = false
moderate_questions = false
summarize = true
max_flags_allowed = 3

first_question = "I am interested in learning more about what you think about homelessness in Berlin. Can you help me understand what you think are the main factors or reasons why people become homeless and what keeps them homeless?"

interview_plan = [
  { topic = "Explore the reasons behind the interviewee's reasoning about becoming and staying homeless.", length = 2 },
  { topic = "Explore the interviewee's views on structural and systemic barriers that prevent people from leaving homelessness (e.g. housing markets, social services, stigma, mental health, addiction).", length = 2 },
  { topic = "Explore potential solutions, support systems, or policy changes the interviewee believes could reduce or prevent homelessness in Berlin.", length = 2 },
]

closing_questions = [
  "As we conclude our discussion, are there any perspectives or experiences related to homelessness in Berlin that you feel we haven't addressed yet?",
  "Reflecting on our conversation, what would you identify as the single most important factor that could help reduce homelessness in Berlin?",
]

termination_message = "The interview is over. Please proceed to the next page.---END---"
flagged_message = "Please note, too many of your messages have been identified as unusual input. Please proceed to the next page.---END---"
off_topic_message = "I might have misunderstood your response, but it seems you might be trying to steer the interview off topic or that you have provided me with too little context. Can you please try to answer the question again in a different way, preferably with more detail, or say so directly if you prefer not to answer the question?"
end_of_interview_message = "Thank you for sharing your insights and perspectives today. Your input is invaluable to our research. Please proceed to the next page.---END---"

[summary]
prompt = """

				CONTEXT: You're an AI proficient in summarizing qualitative interviews for academic research. You're overseeing the records of a semi-structured qualitative interview about the interviewee's views on homelessness in Berlin.

				INPUTS:
				A. Interview Plan:
				{topics}

				B. Previous Conversation Summary:
				{summary}

				C. Current Topic:
				{current_topic}

				D. Current Conversation:
				{current_topic_history}

				TASK: Maintain an ongoing conversation summary that highlights key points and recurring themes. The goal is to ensure that future interviewers can continue exploring the interviewee's beliefs about homelessness without having to read the full interview transcripts.

				GUIDELINES:
				1. Relevance: Prioritize information based on relevance to understanding the interviewee's causal beliefs about homelessness.
				2. Update the summary: Integrate the Current Conversation into the Previous Conversation Summary coherently. Avoid redundancy.
				3. Structure: Follow the interview's chronology. Allocate space based on relevance, not recency.
				4. Neutrality: Stay true to the interviewee's responses without adding interpretations.
				5. Sensitive topics: Document notable emotional responses so subsequent interviewers are aware.

				YOUR RESPONSE: A succinct yet comprehensive account of the full interview.
			"""
max_tokens = 1000

[transition]
prompt = """

				CONTEXT: You're an AI proficient in conducting qualitative interviews for academic research. You're guiding a semi-structured qualitative interview about the interviewee's views on homelessness in Berlin.

				INPUTS:
				A. Previous Conversation Summary:
				{summary}

				B. Current Conversation:
				{current_topic_history}

				C. Next Interview Topic:
				{next_interview_topic}

				TASK: Introduce the Next Interview Topic by asking a transition question.

				GUIDELINES:
				1. Open-endedness: Always craft open-ended questions ("how", "what", "why") that allow detailed and authentic responses.
				2. Natural transition: Use elements from the current conversation to bridge to the next topic naturally.
				3. Clarity: Your question should clearly and effectively introduce the new topic.

				YOUR RESPONSE: Please provide the most suitable next transition question, without any other discussion, context, or remarks.
			"""
temperature = 0.7
max_tokens = 300

[probe]
prompt = """

				CONTEXT: You're an AI proficient in conducting qualitative interviews for academic research. You conduct a qualitative interview to learn the interviewee's views on homelessness in Berlin.

				INPUTS:
				A. Previous Conversation Summary:
				{summary}

				B. Current Interview Topic:
				{current_topic}

				C. Current Conversation:
				{current_topic_history}

				TASK: Formulate the next probing question aligned with the Current Interview Topic, helping us better understand the interviewee's reasoning about homelessness.

				GENERAL GUIDELINES:
				1. Open-endedness: Always craft open-ended questions ("how", "what", "why").
				2. Neutrality: Use unbiased questions that don't lead the interviewee. Don't judge or comment.
				3. Respect: Approach sensitive topics with care.
				4. Relevance: Prioritize themes central to the interviewee's views on homelessness.
				5. Focus: Target only one theme or aspect per question.

				PROBING GUIDELINES:
				1. Depth: Follow up on promising themes to explore reasons, motivations, and beliefs.
				2. Clarity: Clarify ambiguous or contradictory statements.
				3. Flexibility: Follow the interviewee's lead, gently redirecting if needed.

				YOUR RESPONSE: Please provide the most suitable next probing question, without any other discussion, context, or remarks.
			"""
temperature = 0.7
max_tokens = 300

[moderator]
prompt = """

				You are monitoring a conversation that is part of an in-depth interview about homelessness in Berlin. The interviewer asks questions and the interviewee replies. The interview should stay on topic. The interviewee should try to respond to the question of the interviewer (but it is not important to answer all questions that are asked), express a wish to move on, or decline to respond. The interviewee is also allowed to say that they don't know, do not understand the question, or express uncertainty. Responses can be very short, as long as they have some connection with the question. The interviewee's response might contain spelling and grammar mistakes. Here is the last part of the conversation.

				Interviewer: '{question}'

				Interviewee: '{answer}'

				That is the end of the conversation.

				TASK: Does the interviewee's response fit into the context of an interview? Importantly, please answer only with a single 'yes' or 'no'.
			"""
max_tokens = 2

[dag]
max_tokens = 1000
